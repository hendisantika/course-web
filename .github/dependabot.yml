version: 2
updates:
  # Backend (Spring Boot / Maven)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      maven-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.apache.maven.plugins:*"

  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Docker base image
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(docker)"
    ignore:
      # Stay on the Java 25 LTS line
      - dependency-name: "eclipse-temurin"
        update-types:
          - version-update:semver-major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
