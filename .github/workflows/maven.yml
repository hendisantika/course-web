# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload backend JAR
      uses: actions/upload-artifact@v7
      with:
        name: backend-jar
        path: target/course-web-*.jar
        retention-days: 1

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c

  frontend:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The /course page fetches categories from the backend while prerendering
      API_HOST: http://localhost:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Download backend JAR
      uses: actions/download-artifact@v8
      with:
        name: backend-jar
        path: backend

    - name: Start backend
      working-directory: .
      run: |
        nohup java -jar backend/course-web-*.jar > backend.log 2>&1 &
        for i in $(seq 1 60); do
          curl -sf http://localhost:8080/api/courses/category > /dev/null && echo "Backend is up" && exit 0
          sleep 2
        done
        echo "Backend failed to start"; cat backend.log; exit 1

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm build
